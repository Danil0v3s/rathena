name: Build servers on macOS
# build_servers_macos.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # Always trigger all Github Actions if an action or something CI related was changed
      - '.github/**'
      - 'tools/ci/**'
      # This workflow should run when a file in a source directory has been modified.
      - 'src/**'
      # This workflow should run whenever a build related file has been modified
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'

jobs:
  build:
    # Github Actions checks for '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]', or '[actions skip]' but not a hyphenated version.
    # It's a catch-all incase a Pull Request has been opened and someone is on auto-pilot.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          # The macos-latest label currently points to macos-15.
          os: [macos-14, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cmake-build
        with:
          cache-key: ${{ matrix.os }}
          cmake-args: -DENABLE_EXTRA_BUILDBOT_CODE=ON
