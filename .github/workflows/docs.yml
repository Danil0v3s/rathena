name: Documentation
# docs.yml
# Builds the MkDocs site from doc/ on every change and publishes it to GitHub Pages from master.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/docs.yml'
      - 'doc/**'
      - 'mkdocs.yml'
      - 'tools/mkdocs_hooks.py'
      - 'tools/doc2md.py'
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'doc/**'
      - 'mkdocs.yml'
      - 'tools/mkdocs_hooks.py'
      - 'tools/doc2md.py'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install 'mkdocs-material>=9,<10'

      - name: Build (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
