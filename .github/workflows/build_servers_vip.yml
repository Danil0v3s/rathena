name: Build servers in VIP mode
# build_servers_vip.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Always trigger all Github Actions if an action or something CI related was changed
      - '.github/**'
      - 'tools/ci/**'
      # This workflow should run when a file in a source directory has been modified.
      - 'src/**'
      # This workflow should run whenever a build related file has been modified
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'

jobs:
  build:
    # Github Actions checks for '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]', or '[actions skip]' but not a hyphenated version.
    # It's a catch-all incase a Pull Request has been opened and someone is on auto-pilot.
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          mode: [PRE, RE]
          include:
            - mode: PRE
              prere: 'ON'
            - mode: RE
              prere: 'OFF'

    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Setup Database and import table data
        run: ./tools/ci/sql.sh

      - uses: ./.github/actions/cmake-build
        with:
          cache-key: gcc
          cmake-args: >-
            -DENABLE_PRERE=${{ matrix.prere }}
            -DENABLE_VIP=ON
            -DENABLE_EXTRA_BUILDBOT_CODE=ON
          targets: login-server char-server map-server generate-import-files

      - name: Run Once - login-server
        run: ./login-server --run-once

      - name: Run Once - char-server
        run: ./char-server --run-once

      - name: Run Once - map-server
        run: ./map-server --run-once
