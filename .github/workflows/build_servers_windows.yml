name: Build servers on Windows
# build_servers_windows.yml
# Uses the 'msvs' / 'msvs-2026' presets, i.e. the same Visual Studio solution developers get from 'cmake --preset msvs'.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      # Always trigger all Github Actions if an action or something CI related was changed
      - '.github/**'
      - 'tools/ci/**'
      # This workflow should run when a file in a source directory has been modified.
      - 'src/**'
      # This workflow should run whenever a build related file has been modified
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
  pull_request:
    paths:
      # Always trigger all Github Actions if an action or something CI related was changed
      - '.github/**'
      - 'tools/ci/**'
      # This workflow should run when a file in a source directory has been modified.
      - 'src/**'
      # This workflow should run whenever a build related file has been modified
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'

jobs:
  build:
    # Github Actions checks for '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]', or '[actions skip]' but not a hyphenated version.
    # It's a catch-all incase a Pull Request has been opened and someone is on auto-pilot.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          # windows-2022 is the last image with Visual Studio 2022, windows-latest ships Visual Studio 2026.
          include:
            - os: windows-2022
              preset: msvs
              mode: PRE
              prere: 'ON'
            - os: windows-latest
              preset: msvs-2026
              mode: RE
              prere: 'OFF'

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cmake-build
        with:
          preset: ${{ matrix.preset }}
          config: Debug
          cache-key: msvc
          cmake-args: >-
            -DENABLE_PRERE=${{ matrix.prere }}
            -DENABLE_EXTRA_BUILDBOT_CODE=ON
