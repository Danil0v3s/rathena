name: Generate Visual Studio solution
# generate_msvs.yml
# Manual: configures with the Visual Studio preset on a Windows runner and uploads the
# generated solution / project files as an artifact.
#
# The files embed the runner's absolute path (D:\a\rathena\rathena). They open as-is
# only if the repository is checked out at that same path; otherwise treat them as
# reference and run 'cmake --preset msvs' locally (a few minutes, see README).
# The output is committed under build-msvs/ and build-msvs-2026/; refresh those from the artifacts.

on:
  # Manual dispatch only works once the workflow exists on the default branch;
  # until then a push that touches this file generates both flavours.
  workflow_dispatch:
    inputs:
      preset:
        description: CMake preset
        type: choice
        default: msvs
        options: [msvs, msvs-2026]
      cmake-args:
        description: Extra configure arguments, e.g. -DENABLE_PRERE=ON -DPACKETVER=20211103
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/generate_msvs.yml'

jobs:
  generate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 is the last image with Visual Studio 2022; windows-latest ships Visual Studio 2026.
        # A manual run generates only the chosen preset, a push generates both.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.preset == 'msvs-2026' && '[{"preset":"msvs-2026","os":"windows-latest"}]' || '[{"preset":"msvs","os":"windows-2022"}]') || '[{"preset":"msvs","os":"windows-2022"},{"preset":"msvs-2026","os":"windows-latest"}]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-msvc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-msvc-

      - name: Configure (${{ matrix.preset }})
        shell: bash
        run: cmake --preset ${{ matrix.preset }} ${{ inputs.cmake-args || '' }}

      - name: Describe
        shell: bash
        run: |
          {
            echo "Generated on $(date -u +%Y-%m-%dT%H:%MZ) from $GITHUB_SHA (${GITHUB_REF_NAME})"
            echo "preset: ${{ matrix.preset }}   cmake-args: ${{ inputs.cmake-args || '' }}"
            echo "source path baked into the projects: $(cygpath -w "$PWD")"
            echo
            echo "To use as-is, check the repository out at exactly that path, run 'cmake --preset ${{ matrix.preset }}' once"
            echo "so vcpkg installs the dependencies into build-${{ matrix.preset }}/vcpkg_installed, then open the solution."
          } > build-${{ matrix.preset }}/README-generated.txt
          cat build-${{ matrix.preset }}/README-generated.txt
          echo; echo "generated:"; ls build-${{ matrix.preset }}

      - uses: actions/upload-artifact@v4
        with:
          name: rathena-${{ matrix.preset }}-solution
          if-no-files-found: error
          path: |
            build-${{ matrix.preset }}/README-generated.txt
            build-${{ matrix.preset }}/*.sln
            build-${{ matrix.preset }}/*.slnx
            build-${{ matrix.preset }}/**/*.vcxproj
            build-${{ matrix.preset }}/**/*.vcxproj.filters
            !build-${{ matrix.preset }}/vcpkg_installed/**
            !build-${{ matrix.preset }}/CMakeFiles/**
            !build-msvs/vcpkg_installed/**
            !build-msvs/CMakeFiles/**
